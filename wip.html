<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Work In Progress</title>

  <style>

    *{
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body{
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background-color: rgb(187, 168, 224);
      font-family: 'Poppins', sans-serif;
      overflow: hidden;
    }

    .container{
      text-align: center;
      background-color: white;
      padding: 60px;
      border-radius: 20px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.1);
      max-width: 700px;
      animation: fadeIn 1s ease;
    }

    .emoji{
      font-size: 5rem;
      margin-bottom: 20px;
    }

    h1{
      font-size: 3rem;
      color: rgb(72, 32, 120);
      margin-bottom: 20px;
    }

    p{
      font-size: 1.2rem;
      color: rgb(80, 80, 80);
      line-height: 1.8;
      margin-bottom: 35px;
    }

    .btn{
      display: inline-block;
      padding: 14px 28px;
      background-color: rgb(72, 32, 120);
      color: white;
      text-decoration: none;
      border-radius: 10px;
      transition: 0.3s;
      font-size: 1rem;
    }

    .btn:hover{
      background-color: rgb(52, 20, 90);
      transform: scale(1.05);
    }

    @keyframes fadeIn{
      from{
        opacity: 0;
        transform: translateY(20px);
      }

      to{
        opacity: 1;
        transform: translateY(0);
      }
    }

  </style>
</head>

<body>

  <div class="container">

    <div class="emoji">
      🚧
    </div>

    <h1>Work In Progress</h1>

    <p>
      This feature or page is currently under development.
      Some sections of the portfolio are still being built
      and improved. Please check back later for updates.
    </p>

    <a href="index.html" class="btn">
      Back to Home
    </a>

  </div>

</body>
</html>
